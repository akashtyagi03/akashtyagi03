<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <radialGradient id="glow1" cx="25%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <radialGradient id="glow2" cx="75%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)" />
  <rect width="1280" height="400" fill="url(#glow1)" />
  <rect width="1280" height="400" fill="url(#glow2)" />

  <!-- Decorative system lines -->
  <g stroke="#30363d" stroke-width="1" opacity="0.6">
    <line x1="100" y1="80" x2="400" y2="80"/>
    <line x1="880" y1="320" x2="1180" y2="320"/>
    <line x1="200" y1="260" x2="480" y2="260"/>
    <line x1="760" y1="120" x2="1080" y2="120"/>
  </g>

  <!-- Title -->
  <text x="640" y="170"
        text-anchor="middle"
        font-size="42"
        fill="#ffffff"
        font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-weight="600">
    Full Stack &amp; AI Automation Engineer
  </text>

  <!-- Subtitle -->
  <text x="640" y="215"
        text-anchor="middle"
        font-size="18"
        fill="#9ca3af"
        font-family="Segoe UI, Inter, system-ui, sans-serif">
    Building intelligent systems and automating complex workflows
  </text>

  <!-- Icon-style nodes -->
  <g fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.7">
    <circle cx="540" cy="260" r="10"/>
    <circle cx="640" cy="260" r="10"/>
    <circle cx="740" cy="260" r="10"/>
    <line x1="550" y1="260" x2="630" y2="260"/>
    <line x1="650" y1="260" x2="730" y2="260"/>
  </g>
</svg>
